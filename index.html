<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="2x2부터 10x10까지 돌려 볼 수 있는 루빅스 큐브. 3x3은 풀이도 계산해 줘요." />
    <link rel="icon" href="data:," />
    <title>루빅스 큐브</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7fafc;
        --paper: #ffffff;
        --ink: #172033;
        --muted: #5c6b7d;
        --line: #d7e0ea;
        --blue: #2563eb;
        --red: #e84a5f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; line-height: 1.5;
      }
      .page { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 56px; }
      h1 { margin: 0 0 4px; font-size: clamp(30px, 5vw, 48px); line-height: 1.1; }
      .sub { margin: 0 0 20px; color: var(--muted); }

      .layout { display: grid; grid-template-columns: 1fr; gap: 16px; }
      @media (min-width: 900px) { .layout { grid-template-columns: 7fr 5fr; align-items: start; } }

      .card {
        border: 2px solid var(--line); border-radius: 8px; padding: 18px 20px;
        background: var(--paper); box-shadow: 0 10px 30px rgba(23, 32, 51, 0.05);
      }
      .card h2 { margin: 0 0 12px; font-size: 18px; }
      .card h2:not(:first-child) { margin-top: 20px; }

      .stage {
        width: 100%; max-width: 640px; aspect-ratio: 1 / 1; margin: 0 auto;
        border-radius: 8px; overflow: hidden;
        background: radial-gradient(circle at 50% 40%, #ffffff 0%, #e8eef6 100%);
      }
      #cv { width: 100%; height: 100%; display: block; cursor: grab; }
      #cv:active { cursor: grabbing; }
      .hint { margin: 8px 0 0; text-align: center; font-size: 13px; color: var(--muted); }

      .sizes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
      .size {
        border: 2px solid var(--line); border-radius: 6px; padding: 7px 0; background: var(--paper);
        font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); cursor: pointer;
      }
      .size[aria-pressed="true"] { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18); }
      .size:disabled { opacity: 0.5; cursor: default; }

      .row { display: flex; flex-wrap: wrap; gap: 8px; }
      .btn {
        border: 2px solid var(--line); border-radius: 8px; padding: 8px 14px; background: var(--paper);
        font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer;
      }
      .btn:hover:not(:disabled) { border-color: rgba(37, 99, 235, 0.5); }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
      .btn.primary:hover:not(:disabled) { background: #1d4ed8; border-color: #1d4ed8; }
      .btn.small { padding: 5px 10px; font-size: 13px; }

      .status { margin: 12px 0 0; padding: 8px 12px; border-radius: 6px; background: #eef6ff; color: #1d4ed8; font-size: 14px; }
      .status.ok { background: #e9f8f0; color: #0f6b3f; }
      .status.warn { background: #fff3e6; color: #a35200; }
      .status.err { background: #fdecef; color: #b4233b; }
      .stats { margin: 10px 0 0; font-size: 14px; color: var(--muted); }

      .note { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
      details { margin-top: 10px; }
      summary { cursor: pointer; font-size: 14px; font-weight: 700; }
      .faces { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      input[type="file"] { display: none; }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>루빅스 큐브</h1>
      <p class="sub">2×2부터 10×10까지. 조각을 드래그하면 그 줄이 돌아가요.</p>

      <main class="layout">
        <section class="card" aria-label="큐브">
          <div class="stage"><canvas id="cv" aria-label="루빅스 큐브 화면"></canvas></div>
          <p class="hint">조각을 드래그: 그 줄 돌리기 · 빈 곳을 드래그: 큐브 전체 돌리기</p>
        </section>

        <section class="card" aria-label="조작">
          <h2>크기</h2>
          <div class="sizes" id="sizes" role="group" aria-label="큐브 크기"></div>

          <h2>조작</h2>
          <div class="row">
            <button class="btn" id="scrambleBtn" type="button">섞기</button>
            <button class="btn" id="undoBtn" type="button">되돌리기</button>
            <button class="btn primary" id="solveBtn" type="button">풀기</button>
            <button class="btn" id="resetBtn" type="button">초기화</button>
          </div>
          <p class="stats" id="stats"></p>
          <p class="status" id="status" role="status"></p>
          <p class="note">3×3은 풀이를 계산해서 보여 줘요. 다른 크기는 섞은 순서를 거꾸로 되돌려요.</p>

          <h2>내 그림 입히기</h2>
          <div class="row">
            <button class="btn" id="imgAllBtn" type="button">그림 고르기 (6면 모두)</button>
            <button class="btn" id="imgClearBtn" type="button">그림 지우기</button>
          </div>
          <details>
            <summary>면마다 다른 그림</summary>
            <div class="faces" id="faceBtns"></div>
          </details>
          <p class="note">가지고 있는 사진이나 로고를 고르면 큐브 면에 입혀 볼 수 있어요. 고른 그림은 이 브라우저 안에서만 쓰이고 어디로도 전송되지 않아요.</p>
          <input type="file" id="fileInput" accept="image/*" />
        </section>
      </main>
    </div>

    <script src="nxn-cube.js"></script>
    <script>
      (function () {
        'use strict';
        const $ = (id) => document.getElementById(id);
        const FACE_NAMES = ['윗면', '오른쪽 면', '앞면', '아랫면', '왼쪽 면', '뒤쪽 면'];
        let cube = null;
        let solvedNote = ''; // 풀이를 다 보여 준 뒤에도 남겨 둘 문구

        /* ---------- 상태 문구 ---------- */
        function setStatus(text, kind) {
          const el = $('status');
          el.textContent = text;
          el.className = 'status' + (kind ? ' ' + kind : '');
        }
        function refresh() {
          if (!cube) return;
          $('stats').textContent = cube.N + '×' + cube.N + '×' + cube.N + ' · 돌린 횟수 ' + cube.moveCount + '회';
          document.querySelectorAll('.size').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.n) === cube.N)));
        }
        function settle() {
          if (!cube || cube.busy) return;
          refresh();
          if (cube.isSolved()) {
            if (solvedNote) { setStatus('맞췄어요! ' + solvedNote, 'ok'); solvedNote = ''; }
            else setStatus(cube.moveCount > 0 ? '맞췄어요!' : '완성된 상태예요. "섞기"를 눌러 보세요.', 'ok');
          }
          else setStatus('섞인 상태예요. 조각을 드래그해서 돌려 보세요.', '');
        }
        function setBusy(b) {
          ['scrambleBtn', 'undoBtn', 'solveBtn', 'resetBtn'].forEach((id) => ($(id).disabled = b));
          document.querySelectorAll('.size').forEach((x) => (x.disabled = b));
          if (!b) settle();
        }

        cube = new window.NxNCube($('cv'), { onChange: refresh, onBusy: setBusy });
        window.cube = cube;

        /* ---------- 크기 ---------- */
        for (let n = 2; n <= 10; n++) {
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'size'; b.dataset.n = String(n);
          b.textContent = n + '×' + n;
          b.addEventListener('click', () => { cube.reset(n); settle(); });
          $('sizes').appendChild(b);
        }

        /* ---------- 조작 ---------- */
        $('scrambleBtn').addEventListener('click', () => { cube.scramble(); setStatus('섞는 중…', ''); });
        $('undoBtn').addEventListener('click', () => {
          if (!cube.undo()) setStatus('되돌릴 기록이 없어요.', 'warn');
        });
        $('resetBtn').addEventListener('click', () => { cube.reset(); settle(); });

        // 3x3 풀이 계산: 웹 워커, 안 되면 화면 스레드
        let worker = null, workerFailed = false, nextId = 1;
        const waiting = new Map();
        try {
          worker = new Worker('cube-solver.js');
          worker.onmessage = (ev) => {
            const msg = ev.data || {};
            const w = waiting.get(msg.id);
            if (!w) return;
            waiting.delete(msg.id);
            if (msg.type === 'error') w.reject(new Error(msg.message)); else w.resolve(msg);
          };
          worker.onerror = () => {
            workerFailed = true; worker = null;
            waiting.forEach((w) => w.reject(new Error('계산기를 시작하지 못했어요. 다시 눌러 보세요.')));
            waiting.clear();
          };
        } catch (e) { workerFailed = true; worker = null; }
        function loadScript(src) {
          return new Promise((res, rej) => {
            const s = document.createElement('script');
            s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s);
          });
        }
        async function solve3(facelets) {
          if (worker && !workerFailed) {
            return new Promise((resolve, reject) => {
              const id = nextId++;
              waiting.set(id, { resolve, reject });
              worker.postMessage({ type: 'solve', id, facelets });
            });
          }
          if (!window.CubeSolver) { await loadScript('cube-core.js'); await loadScript('cube-solver.js'); }
          await new Promise((r) => setTimeout(r, 30));
          return window.CubeSolver.solveFacelets(facelets);
        }

        $('solveBtn').addEventListener('click', async () => {
          if (cube.busy) return;
          if (cube.isSolved()) { setStatus('이미 맞춰져 있어요.', 'ok'); return; }
          if (cube.N === 3) {
            setBusy(true); // 계산하는 동안 다른 버튼이 눌리지 않게 잠근다
            setStatus('풀이 계산 중…', '');
            try {
              const res = await solve3(cube.getFacelets());
              if (!res.ok) { setBusy(false); setStatus('이 상태는 풀 수 없어요. 초기화해 주세요.', 'err'); return; }
              const moves = cube.movesFromNames(res.moves);
              cube.clearHistory();
              cube.enqueueAll(moves, false);
              solvedNote = '(' + res.moves.length + '수 풀이: ' + res.moves.join(' ') + ')';
              setStatus(res.moves.length + '수 풀이: ' + res.moves.join(' '), 'ok');
            } catch (err) {
              setBusy(false);
              setStatus('풀이를 구하지 못했어요: ' + err.message, 'err');
            }
          } else {
            const rev = cube.reverseSolution();
            if (!rev.length) { setStatus('되돌릴 기록이 없어요. "초기화"를 눌러 주세요.', 'warn'); return; }
            cube.clearHistory();
            cube.enqueueAll(rev, false);
            solvedNote = '(섞은 순서를 거꾸로 되돌렸어요)';
            setStatus('돌린 순서를 거꾸로 되돌리는 중 (' + rev.length + '수)', 'ok');
          }
        });

        /* ---------- 그림 ---------- */
        const input = $('fileInput');
        let target = -1; // -1: 6면 모두, 0..5: 해당 면
        function pick(face) { target = face; input.value = ''; input.click(); }
        $('imgAllBtn').addEventListener('click', () => pick(-1));
        $('imgClearBtn').addEventListener('click', () => { cube.clearImages(); setStatus('그림을 지웠어요.', ''); });
        FACE_NAMES.forEach((name, f) => {
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'btn small'; b.textContent = name;
          b.addEventListener('click', () => pick(f));
          $('faceBtns').appendChild(b);
        });
        input.addEventListener('change', () => {
          const file = input.files && input.files[0];
          if (!file) return;
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            if (target < 0) cube.setAllImages(img); else cube.setFaceImage(target, img);
            URL.revokeObjectURL(url);
            setStatus(target < 0 ? '그림을 6면에 입혔어요.' : FACE_NAMES[target] + '에 그림을 입혔어요.', 'ok');
          };
          img.onerror = () => { URL.revokeObjectURL(url); setStatus('이 파일은 그림으로 읽을 수 없어요.', 'err'); };
          img.src = url;
        });

        settle();
      })();
    </script>
  </body>
</html>
