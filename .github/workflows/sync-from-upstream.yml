name: Sync from bloomgloom/informatics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream and sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git clone --depth 1 https://github.com/bloomgloom/informatics.git /tmp/upstream

          cp CNAME /tmp/CNAME.bak 2>/dev/null || true
          cp -r .github /tmp/github.bak 2>/dev/null || true

          rsync -a --delete \
            --exclude='.git' \
            --exclude='CNAME' \
            --exclude='.github' \
            --exclude='*_정답.ipynb' \
            --exclude='ai/index.html' \
            --exclude='ai/textbook/' \
            --exclude='ai/lab/' \
            --exclude='ai/jlite/' \
            --exclude='ai/ch1-1/' \
            --exclude='ai/ch1-2/' \
            --exclude='ai/ch1-3/' \
            --exclude='ai/ch3-1/' \
            --exclude='ai/ch3-2/' \
            --exclude='ai/ch4-1/' \
            --exclude='informatics/index.html' \
            --exclude='informatics/ch2-3/index.html' \
            --exclude='informatics/ch2-3/*.ipynb' \
            --exclude='informatics/ch2-3/*.csv' \
            --exclude='informatics/ch3-3/index.html' \
            --exclude='informatics/ch3-4/index.html' \
            --exclude='tools/' \
            /tmp/upstream/ ./

          if [ -f /tmp/CNAME.bak ]; then
            cp /tmp/CNAME.bak CNAME
          fi

          if [ -d /tmp/github.bak ]; then
            rm -rf .github
            cp -r /tmp/github.bak .github
          fi

          git add -A
          if git diff --staged --quiet; then
            echo "Already up to date"
          else
            git commit -m "Sync from informatics $(date -u +%Y-%m-%d)"
            git push origin main
          fi
