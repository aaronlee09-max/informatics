name: Build JupyterLite

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai/ch2-1/**/*.ipynb'
      - 'ai/ch2-2/**/*.ipynb'
      - 'ai/ch2-1/**/*.csv'
      - 'ai/ch2-2/**/*.csv'
      - 'informatics/**/*.ipynb'
      - 'informatics/**/*.csv'
      - '.github/workflows/build-jupyterlite.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JupyterLite
        run: |
          pip install -q jupyterlite-core==0.8.3 jupyterlite-pyodide-kernel==0.8.5 jupyter-server

      - name: Stage notebook contents
        run: |
          mkdir -p /tmp/jlite-contents/ch2-1 \
                   /tmp/jlite-contents/ch2-2/2 \
                   /tmp/jlite-contents/ch2-2/3 \
                   /tmp/jlite-contents/ch2-2/4 \
                   /tmp/jlite-contents/informatics/ch2-3 \
                   /tmp/jlite-contents/informatics/ch3-3 \
                   /tmp/jlite-contents/informatics/ch3-4

          find ai/ch2-1 -maxdepth 1 -name '*.ipynb' -exec cp {} /tmp/jlite-contents/ch2-1/ \;
          find ai/ch2-1 -maxdepth 1 -name '*.csv' -exec cp {} /tmp/jlite-contents/ch2-1/ \;
          for sub in 2 3 4; do
            if [ -d "ai/ch2-2/$sub" ]; then
              find "ai/ch2-2/$sub" -maxdepth 1 -name '*.ipynb' -exec cp {} "/tmp/jlite-contents/ch2-2/$sub/" \;
              find "ai/ch2-2/$sub" -maxdepth 1 -name '*.csv' -exec cp {} "/tmp/jlite-contents/ch2-2/$sub/" \;
            fi
          done

          for ch in ch2-3 ch3-3 ch3-4; do
            if [ -d "informatics/$ch" ]; then
              find "informatics/$ch" -maxdepth 1 -name '*.ipynb' -exec cp {} "/tmp/jlite-contents/informatics/$ch/" \;
              find "informatics/$ch" -maxdepth 1 -name '*.csv' -exec cp {} "/tmp/jlite-contents/informatics/$ch/" \;
            fi
          done

          echo '--- staged ---'
          find /tmp/jlite-contents -type f | sort

      - name: Neutralize broken pip subprocess cells
        run: |
          python3 << 'PY'
          import json, pathlib
          # Colab용 subprocess pip은 브라우저에서 실패하므로,
          # 패키지는 커널 preload로 이미 들어가 있다고 가정하고
          # 설치 셀은 import 확인만 하도록 바꿈.
          NEW = '''# 라이브러리는 JupyterLite 커널에 미리 포함되어 있습니다.
# (Colab에서는 아래 설치 코드가 실행됩니다.)
import sys

if sys.platform != "emscripten":
    import importlib, subprocess
    for module_name, pip_name in [
        ("pandas", "pandas"),
        ("numpy", "numpy"),
        ("matplotlib", "matplotlib"),
        ("seaborn", "seaborn"),
        ("sklearn", "scikit-learn"),
    ]:
        try:
            importlib.import_module(module_name)
        except ModuleNotFoundError:
            subprocess.run([sys.executable, "-m", "pip", "install", "-q", pip_name], check=False)

print("라이브러리 준비 완료")
'''
          fixed = 0
          for p in pathlib.Path('/tmp/jlite-contents').rglob('*.ipynb'):
              nb = json.loads(p.read_text(encoding='utf-8'))
              changed = False
              for c in nb.get('cells', []):
                  if c.get('cell_type') != 'code':
                      continue
                  src = ''.join(c.get('source', []))
                  if 'subprocess' in src and 'pip' in src and 'importlib' in src:
                      extra = ''
                      if 'set_config' in src:
                          extra = 'from sklearn import set_config\nset_config(display="text")\n\n'
                      body = NEW
                      if extra:
                          body = body.replace('print("라이브러리 준비 완료")', extra + 'print("라이브러리 준비 완료")')
                      c['source'] = body.splitlines(keepends=True)
                      c['outputs'] = []
                      c['execution_count'] = None
                      changed = True
              if changed:
                  p.write_text(json.dumps(nb, ensure_ascii=False, indent=1), encoding='utf-8')
                  fixed += 1
                  print('patched', p)
          print('patched_count', fixed)
          PY

      - name: Build JupyterLite (with preloaded packages)
        run: |
          cat > /tmp/jupyter-lite.json << 'EOF'
          {
            "jupyter-lite-schema-version": 0,
            "jupyter-config-data": {
              "appName": "정보·AI 실습 JupyterLite",
              "collaborative": false,
              "litePluginSettings": {
                "@jupyterlite/pyodide-kernel-extension:kernel": {
                  "loadPyodideOptions": {
                    "packages": [
                      "numpy",
                      "pandas",
                      "matplotlib",
                      "scipy",
                      "scikit-learn",
                      "seaborn",
                      "micropip"
                    ]
                  }
                }
              }
            }
          }
          EOF
          cd /tmp
          jupyter lite build --contents /tmp/jlite-contents --output-dir /tmp/jlite-out --config /tmp/jupyter-lite.json
          # ensure config is in output
          cp /tmp/jupyter-lite.json /tmp/jlite-out/jupyter-lite.json || true
          du -sh /tmp/jlite-out
          echo '--- jupyter-lite.json ---'
          cat /tmp/jlite-out/jupyter-lite.json 2>/dev/null || cat /tmp/jupyter-lite.json

      - name: Commit to ai/jlite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf ai/jlite
          mkdir -p ai/jlite
          cp -a /tmp/jlite-out/. ai/jlite/
          git add -A ai/jlite
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Build JupyterLite with preloaded pandas/numpy/sklearn/seaborn"
            git push origin HEAD:main
          fi
