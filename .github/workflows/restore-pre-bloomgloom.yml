name: Restore pre-bloomgloom-sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore files from e949b3c (before bloomgloom content overlay)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TARGET=e949b3c1c954e33d0e5124cc8f530eb932b1d4b2
          git checkout "$TARGET" -- .
          git add -A
          if git diff --staged --quiet; then
            echo "Already at target tree"
          else
            git commit -m "Revert: bloomgloom 내용 동기화 전 상태(실습실행/정답/교과서/버튼) 복구 e949b3c"
            git push
          fi
