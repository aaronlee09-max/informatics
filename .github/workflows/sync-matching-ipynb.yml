name: Sync matching ipynb from bloomgloom

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: bloomgloom/informatics
          path: /tmp/bloom

      - name: Overwrite same-name notebooks and add answer buttons
        run: python3 tools/sync_matching_ipynb.py

      - name: Fill answer notebooks in original format
        run: python3 tools/fill_answer_notebooks.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "sync: bloomgloom same-name ipynb + filled answers + 정답 run buttons"
            git push
          fi
